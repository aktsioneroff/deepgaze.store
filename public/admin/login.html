<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Deep Gaze</title>
    <link rel="stylesheet" href="../css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            padding: 1.5rem;
        }
        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-logo {
            width: 56px; height: 56px;
            border-radius: 50%;
            background: var(--accent);
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 1.5rem;
        }
        .login-card h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .login-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        .login-error {
            background: rgba(248,113,113,0.1);
            border: 1px solid rgba(248,113,113,0.3);
            color: var(--danger);
            padding: 0.75rem 1rem;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            margin-bottom: 1.25rem;
            display: none;
        }
        .login-error.show { display: block; }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-logo">
                <svg width="28" height="28" viewBox="0 0 32 32">
                    <circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="1.5"/>
                    <circle cx="16" cy="16" r="5" fill="currentColor" opacity="0.8"/>
                </svg>
            </div>
            <h1>Deep Gaze</h1>
            <p>Вход в панель управления</p>
            
            <div class="login-error" id="loginError"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label>Логин</label>
                    <input type="text" id="username" placeholder="admin" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="password" placeholder="••••••" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-accent" style="width:100%;justify-content:center;padding:0.85rem;">
                    Войти
                </button>
            </form>
            
            <p style="margin-top:1.5rem;">
                <a href="/" style="color:var(--text-muted);text-decoration:none;font-size:0.85rem;">← На сайт</a>
            </p>
        </div>
    </div>
    
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorEl = document.getElementById('loginError');
            
            if (!username || !password) {
                errorEl.textContent = 'Заполните все поля';
                errorEl.classList.add('show');
                return;
            }
            
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await res.json();
                
                if (res.ok && data.success) {
                    window.location.href = '/admin/index.html';
                } else {
                    errorEl.textContent = data.error || 'Неверный логин или пароль';
                    errorEl.classList.add('show');
                }
            } catch (err) {
                errorEl.textContent = 'Ошибка соединения с сервером';
                errorEl.classList.add('show');
            }
        });
        
        // Check existing auth
        fetch('/api/check-auth')
            .then(r => r.json())
            .then(data => {
                if (data.authenticated) {
                    window.location.href = '/admin/index.html';
                }
            })
            .catch(() => {});
    </script>
</body>
</html>
